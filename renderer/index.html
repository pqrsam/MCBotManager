<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MCBotManager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="fatal" class="fatal hidden"></div>

  <section id="setup-screen" class="screen hidden">
    <h1>Bot usernames</h1>
    <textarea id="setup-textarea" rows="12" spellcheck="false"></textarea>
    <div class="row">
      <button id="setup-save" class="primary">Save &amp; Continue</button>
      <button id="setup-cancel" class="hidden">Cancel</button>
    </div>
  </section>

  <section id="app-screen" class="screen">
    <header>
      <h1>MCBotManager</h1>
      <div class="connect-bar">
        <label>Host<input id="connect-host" type="text" value="127.0.0.1" spellcheck="false"></label>
        <label class="narrow">Port<input id="connect-port" type="text" value="25565" spellcheck="false"></label>
        <label>Version<select id="connect-version"></select></label>
        <div class="row">
          <button id="btn-connect-all" class="primary">Connect All</button>
          <button id="btn-disconnect-all">Disconnect All</button>
          <button id="btn-edit-bots">Edit Bots</button>
        </div>
      </div>
    </header>

    <main>
      <div class="col">
        <h2>All Players</h2>
        <div class="field"><input id="all-message" type="text" placeholder="Message or /command" spellcheck="false"><button id="all-send-message">Send to All</button></div>

        <h2>Bots</h2>
        <div class="bot-list">
          <table id="bot-table">
            <thead><tr><th>Bot</th><th>Status</th><th>Pos</th><th>HP</th><th></th></tr></thead>
            <tbody id="bot-table-body"></tbody>
          </table>
        </div>
      </div>

      <div class="col">
        <h2>Selected bot: <b id="selected-name">none</b></h2>

        <div class="field"><input id="bot-message" type="text" placeholder="Message or /command" spellcheck="false"><button id="bot-send-chat">Send</button></div>

        <h3>Movement</h3>
        <div class="movement">
          <button class="move" data-control="forward">W</button>
          <button class="move" data-control="left">A</button>
          <button class="move" data-control="back">S</button>
          <button class="move" data-control="right">D</button>
          <button class="move" data-momentary="jump">Jump</button>
          <button class="move" data-control="sneak">Sneak</button>
        </div>

        <h3>Break Block</h3>
        <div class="field">
          <input id="dig-x" type="text" placeholder="X" size="6">
          <input id="dig-y" type="text" placeholder="Y" size="6">
          <input id="dig-z" type="text" placeholder="Z" size="6">
          <button id="btn-dig">Break Block</button>
          <button id="btn-dig-stop" disabled>Stop Breaking</button>
        </div>

        <h3 id="bot-console-title">Bot console</h3>
        <div id="bot-console" class="console"></div>
      </div>
    </main>

    <footer>
      <h3>Global console <button id="btn-toggle-global" class="link">hide</button></h3>
      <div id="global-console" class="console"></div>
    </footer>
  </section>

  <script src="app.js"></script>
</body>
</html>
